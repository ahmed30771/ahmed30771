      <stop offset="0%" stop-color="#0A0E13"/>
      <stop offset="100%" stop-color="#0B1A16"/>
    </linearGradient>
    <pattern id="wgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1A2430" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="460" fill="url(#wbg)"/>

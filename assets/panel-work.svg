  <text x="72" y="308" fill="#3DDC97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">tips-restaurant-sales-insights-python</text>
  <text x="72" y="338" fill="#C8D0D8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Restaurant sales analysis with Python</text>
  <text x="72" y="358" fill="#C8D0D8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">cleaning, EDA, and business insights.</text>
  <circle cx="80" cy="390" r="5" fill="#DA5B0B"/>

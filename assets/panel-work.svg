  <circle cx="494" cy="220" r="5" fill="#DA5B0B"/>
  <text x="506" y="224" fill="#A8B4C0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Jupyter Notebook</text>


name: Generate Animated Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update animated metrics [skip ci]"
          base: header, activity, community, repositories, metadata
          plugin_calendar: yes
          plugin_calendar_limit: 1
          # habits + achievements currently crash on metrics@latest
          # (GitHub Projects classic sunset + null PushEvent commits)
          plugin_achievements: no
          plugin_habits: no
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_lines: yes
          config_timezone: Asia/Karachi
          config_animations: yes
          config_display: large

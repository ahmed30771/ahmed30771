name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ahmed30771
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0C1117&color_dots=#E8EEF2,#B8E6D0,#6FD4A8,#3DDC97,#1FA870
            dist/github-contribution-grid-snake-dark.svg?color_snake=#F2F5F7&color_dots=#1E2A36,#0F3D30,#1A6B4F,#28A070,#3DDC97

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

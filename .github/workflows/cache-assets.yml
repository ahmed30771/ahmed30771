name: Cache Animated Assets Locally

on:
  schedule:
    - cron: "0 */6 * * *"   # har 6 ghantay baad refresh
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  cache-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Download capsule-render header (animated wave)
        run: >
          curl -sL "https://capsule-render.vercel.app/api?type=waving&color=0:FF0080,50:7928CA,100:00F7F2&height=300&section=header&text=AHMED%2030771&fontSize=70&fontColor=fff&animation=twinkling&fontAlignY=32&desc=Python%20Developer%20%7C%20ML%20Explorer%20%7C%20Data%20Storyteller&descAlignY=52&descSize=18"
          -o assets/header.svg

      - name: Download capsule-render footer (animated wave)
        run: >
          curl -sL "https://capsule-render.vercel.app/api?type=waving&color=0:00F7F2,50:7928CA,100:FF0080&height=200&section=footer&text=Thanks%20for%20Visiting!&fontSize=30&fontColor=fff&animation=twinkling"
          -o assets/footer.svg

      - name: Download capsule-render venom dividers (animated)
        run: |
          curl -sL "https://capsule-render.vercel.app/api?type=venom&color=0:FF0080,50:7928CA,100:00F7F2&height=6&section=header" -o assets/divider-venom-1.svg
          curl -sL "https://capsule-render.vercel.app/api?type=venom&color=0:00F7F2,50:7928CA,100:FF0080&height=6&section=header" -o assets/divider-venom-2.svg
          curl -sL "https://capsule-render.vercel.app/api?type=rect&color=0:000000,100:1a1a2e&height=3&section=header" -o assets/divider-rect.svg

      - name: Download typing animation SVG
        run: >
          curl -sL "https://readme-typing-svg.herokuapp.com?font=Fira+Code&weight=800&size=28&duration=2000&pause=600&color=FF0080,7928CA,00F7F2&center=true&vCenter=true&multiline=true&repeat=true&width=900&height=120&lines=Welcome+to+my+corner+of+GitHub;I+turn+raw+data+into+real+insights;Python+%7C+Pandas+%7C+ML+%7C+EDA;Currently+Open+To+Opportunities"
          -o assets/typing.svg

      - name: Download GitHub stats cards
        run: |
          curl -sL "https://github-readme-stats.vercel.app/api?username=ahmed30771&show_icons=true&theme=radical&include_all_commits=true&count_private=true&border_radius=20&border_color=FF0080" -o assets/stats.svg
          curl -sL "https://github-readme-stats.vercel.app/api/top-langs/?username=ahmed30771&layout=compact&theme=radical&border_radius=20&border_color=7928CA" -o assets/top-langs.svg

      - name: Download streak stats
        run: >
          curl -sL "https://github-readme-streak-stats.herokuapp.com/?user=ahmed30771&theme=radical&border_radius=20&border=FF0080"
          -o assets/streak.svg

      - name: Download trophies
        run: >
          curl -sL "https://github-profile-trophy.vercel.app/?username=ahmed30771&theme=radical&no-frame=true&column=4&margin-w=15&margin-h=15&animation=true&row=2"
          -o assets/trophy.svg

      - name: Download repo pin cards
        run: |
          curl -sL "https://github-readme-stats.vercel.app/api/pin/?username=ahmed30771&repo=stock-ml-pipeline-linear-regression&theme=radical&border_radius=20&border_color=FF0080" -o assets/pin-stock-ml.svg
          curl -sL "https://github-readme-stats.vercel.app/api/pin/?username=ahmed30771&repo=telecom-churn-eda-logistic-pipeline&theme=radical&border_radius=20&border_color=7928CA" -o assets/pin-telecom-churn.svg
          curl -sL "https://github-readme-stats.vercel.app/api/pin/?username=ahmed30771&repo=tips-restaurant-sales-insights-python&theme=radical&border_radius=20&border_color=00F7F2" -o assets/pin-tips-restaurant.svg
          curl -sL "https://github-readme-stats.vercel.app/api/pin/?username=ahmed30771&repo=quran-academy&theme=radical&border_radius=20&border_color=FF0080" -o assets/pin-quran-academy.svg

      - name: Validate downloads (skip empty/failed files so a bad fetch never breaks the repo)
        run: |
          for f in assets/*.svg; do
            if [ ! -s "$f" ]; then
              echo "Warning: $f is empty, removing to keep last good version"
              git checkout -- "$f" 2>/dev/null || rm -f "$f"
            fi
          done

      - name: Commit updated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh animated assets [skip ci]"
          file_pattern: "assets/*.svg"
